<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Biblib</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="popup-head">
      <div class="brand"><img src="../icons/icon32.png" alt="" width="22" height="22"> Biblib</div>
      <div class="head-links">
        <button type="button" class="link" id="openPhone" title="Scanner un livre avec votre téléphone">Sur téléphone</button>
        <button type="button" class="link" id="openOptions">Réglages</button>
      </div>
    </header>

    <form class="search" id="searchForm" role="search">
      <label for="query" class="visually-hidden">ISBN ou titre</label>
      <input id="query" type="search" placeholder="ISBN, ou titre et auteur" autocomplete="off" spellcheck="false">
      <button type="submit" class="primary">Chercher</button>
    </form>

    <section id="current" hidden>
      <div class="book">
        <div class="book-title" id="bookTitle"></div>
        <div class="book-meta" id="bookMeta"></div>
      </div>
      <div id="results" class="results"></div>
    </section>

    <p class="hint" id="hint">Ouvrez la fiche d’un livre sur Amazon, Babelio, Bedetheque, Fnac… ou cherchez-le ci-dessus.</p>
  </div>
  <script src="../content/ui.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
